apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name     : myapp1-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name     : in-cluster
    namespace: app1-dev
  source:
    path   : "HelmCharts/MyChart1"
    repoURL: "git@github.com:maxkerim/argocd2.git"
    targetRevision: HEAD
    helm:
      valueFiles:
      - values_dev.yaml
  project: default
  syncPolicy:
    automated:
      prune   : true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

