name: Helm validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          helm lint HelmCharts/nginx-web
          helm lint HelmCharts/nginx-web-example

      - name: Render development and production manifests
        run: |
          helm template demo HelmCharts/nginx-web -f HelmCharts/nginx-web/values_dev.yaml > /dev/null
          helm template demo HelmCharts/nginx-web -f HelmCharts/nginx-web/values_prod.yaml > /dev/null
          helm template demo HelmCharts/nginx-web -f HelmCharts/nginx-web/values_prod.yaml --set ingress.enabled=true > /dev/null
          helm template demo HelmCharts/nginx-web-example -f HelmCharts/nginx-web-example/values.yaml --set ingress.enabled=true > /dev/null