name: Helm validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          helm lint HelmCharts/MyChart1
          helm lint HelmCharts/MyChart2

      - name: Render development and production manifests
        run: |
          helm template demo HelmCharts/MyChart1 -f HelmCharts/MyChart1/values_dev.yaml > /dev/null
          helm template demo HelmCharts/MyChart1 -f HelmCharts/MyChart1/values_prod.yaml > /dev/null
          helm template demo HelmCharts/MyChart1 -f HelmCharts/MyChart1/values_prod.yaml --set ingress.enabled=true > /dev/null
          helm template demo HelmCharts/MyChart2 -f HelmCharts/MyChart2/values.yaml --set ingress.enabled=true > /dev/null