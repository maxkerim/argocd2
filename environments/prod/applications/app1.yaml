apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name     : myapp1-prod
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name     : in-cluster
    namespace: app1-prod
  source:
    path   : "HelmCharts/nginx-web"
    repoURL: "https://github.com/maxkerim/argocd2"
    targetRevision: HEAD
    helm:
      valueFiles:
      - values_prod.yaml
  project: default
  syncPolicy:
    automated:
      prune   : true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

